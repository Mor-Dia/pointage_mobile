name: yogivida_mobile
description: A new Flutter project..

publish_to: 'none'
version: 1.0.7+8

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.1.1 
  authentication_repository:
    path: packages/authentication_repository
  user_repository:
    path: packages/user_repository
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.5
  awesome_notifications: ^0.10.1
  # flutter_local_notifications: ^12.0.4
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_launcher_icons: ^0.14.1
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
#  connectivity_plus: ^6.1.0
#  internet_connection_checker: ^1.0.0+1
  toastification: ^1.0.0
  fluttertoast: ^8.2.8
  lottie: ^3.1.3
  cached_network_image: ^3.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  icons_launcher: ^3.0.0
  cloud_firestore: ^5.6.0
  firebase_app_check: ^0.3.1+7
  flutter_spinkit: ^5.2.0
  flutter_html: ^3.0.0
  in_app_review: ^2.0.9
  package_info_plus: ^8.0.0
  marquee: ^2.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.2.11
  flutter_lints: ^2.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

icons_launcher:
  image_path: "assets/images/logos/newlogo-bg.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/logos/
    - assets/animations/
    - assets/images/logos/logo.png
    - assets/images/logos/newlogo.svg

flutter_native_splash:
  color: "#ffffff"  # Couleur de fond du splash screen
  image: assets/images/splash.png  # Chemin vers l'image du splash screen
  android: true  # Activer le splash screen pour Android
  ios: true  # Activer le splash screen pour iOS
  fill: true  # Ajuster l'image pour qu'elle remplisse l'écran